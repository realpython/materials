[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "weatherly"
version = "1.0.0"
description = "A small weather report CLI."
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
weatherly = "weatherly.cli:main"
