[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "notely"
version = "1.0.0"
description = "A desktop notes app built with PySide6."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyside6==6.12.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
notely = "notely.app:main"

[tool.setuptools.package-data]
notely = ["resources/**/*", "views/ui/*.ui"]
