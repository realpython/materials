[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notes-manager-copilot-test"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[project.scripts]
notes = "notes_manager_copilot_test.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
