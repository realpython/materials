[tool.bandit]
exclude_dirs = ["venv", ".venv", "tests"]
skips = ["B404"]

[tool.ruff]
line-length = 79
# Keeps the repo-wide CI lint from failing on the deliberately insecure
# module. Remove this line to see Ruff reject it in the pre-commit hook.
extend-exclude = ["insecure"]

[tool.ruff.lint]
select = ["E", "F", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
